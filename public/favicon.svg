<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    An M knocked out of a filled tile. Drawn as strokes rather than set
    in Spectral: a serif at 16px turns to mush, and a font would have
    to be embedded or relied upon. The slab feet keep a nod to the
    serif body text without depending on it.
  -->
  <rect class="tile" width="32" height="32" rx="7" fill="#1c1b19" />
  <g class="cut" fill="none" stroke="#faf9f6" stroke-width="3"
     stroke-linecap="square" stroke-linejoin="miter">
    <!-- the M itself -->
    <path d="M9 23V10l7 8 7-8v13" />
    <!-- slab feet -->
    <path d="M6.2 23h5.6M20.2 23h5.6" stroke-width="2.4" />
  </g>
  <style>
    @media (prefers-color-scheme: dark) {
      .tile { fill: #e6e4df; }
      .cut  { stroke: #14161a; }
    }
  </style>
</svg>
