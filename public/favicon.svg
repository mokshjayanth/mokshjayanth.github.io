<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A slider-crank: rotation turned into back-and-forth. The circle is
    the crank's path, the arm runs from pivot to crank pin, the rod on
    to the slider.

    Colours are set on the elements rather than through currentColor:
    inside an <img> or a browser tab there is no inherited colour to
    pick up, so currentColor lands on the default black.
  -->
  <g class="ink" fill="none" stroke="#1c1b19" stroke-width="3.6"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="16" r="7.5" />
    <path d="M12 16 17.3 10.7 28 18.5" />
  </g>
  <g class="dot" fill="#1c1b19">
    <circle cx="12" cy="16" r="3.4" />
    <circle cx="28" cy="18.5" r="3.4" />
  </g>
  <style>
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e6e4df; }
      .dot { fill: #e6e4df; }
    }
  </style>
</svg>
