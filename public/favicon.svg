<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A slider-crank on a solid tile. An outline drawing all but vanishes
    at 16px against a pale browser tab; a filled badge holds its shape,
    so the mechanism is knocked out of the ink rather than drawn in it.
  -->
  <rect class="tile" width="32" height="32" rx="7" fill="#1c1b19" />
  <g class="cut" fill="none" stroke="#faf9f6" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12.5" cy="16" r="5.6" />
    <path d="M12.5 16 16.4 12.1 24.5 18" />
  </g>
  <g class="cutf" fill="#faf9f6">
    <circle cx="12.5" cy="16" r="2.5" />
    <circle cx="24.5" cy="18" r="2.5" />
  </g>
  <style>
    @media (prefers-color-scheme: dark) {
      .tile { fill: #e6e4df; }
      .cut  { stroke: #14161a; }
      .cutf { fill: #14161a; }
    }
  </style>
</svg>
